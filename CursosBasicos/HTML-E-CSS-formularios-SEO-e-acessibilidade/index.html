<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form seo acessibilidade-CULTURAMA</title>
</head>

<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <!--tag fieldset: expoe ao navegador que está começando um conjunto de elementos, relação entre si semanticamente-->
            <fieldset>
                <!--tag legend adiciona legenda-->
                <legend>Dados Pessoais</legend>
                <label for="userName">Nome</label>
                <input type="text" name="userName" required>

                <label for="age">Idade</label>
                <input type="number" name="age" min="12" max="100" required>

                <label for="birthdate">Data de Nascimento</label>
                <input type="date" name="birthdate">

                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>

                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9{11}]"
                    placeholder="DDD + numero sem espaco e hifen">


                <label for="userImage">Upload de Foto</label>
                <input type="file" accept="image/*" name="userImage">
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>
                <p>Gênero</p>
                <input type="radio" name="userGender" value="feminino">
                <label for="userGender">Feminino</label>

                <input type="radio" name="userGender" value="masculino">
                <label for="userGender">Masculino</label>

                <input type="radio" name="userGender" value="outro/prefiroNaoInformar">
                <label for="userGender">Outro/Prefiro Não Informar</label>

                <label for="maritalStatus">Estado Civil</label>
                <select name="maritalStatus">
                    <option value="notSelected">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="viuvo">Viuvo</option>
                    <option value="divorciado">Divorciado</option>
                </select>


                <label for="userState">Estados</label>
                <select name="userState">
                    <option value="Acre">Acre</option>
                    <option value="Alagoas">Alagoas</option>
                    <option value="Amapa">Amapá</option>
                    <option value="Amazonas">Amazonas</option>
                    <option value="Bahia">Bahia</option>
                    <option value="Ceara">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="EspiritoSatno">Espirito Santo</option>
                    <option value="Goias">Goiás</option>
                    <option value="Maranhao">Maranhão</option>
                    <option value="MT do sul">Mato Grosso do Sul</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="Para">Pará</option>
                    <option value="Paraiba">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="Pernambuco">Pernambuco</option>
                    <option value="Piaui">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RG do norte">Rio Grande do Norte</option>
                    <option value="RG do Sul">Rio Grande do Sul</option>
                    <option value="Rondonia">Rondônia</option>
                    <option value="Roraima">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="Sergipe">Sergipe</option>
                    <option value="Tocantins">Tocantins</option>
                </select>


                <label for="userCity">Cidade</label>
                <input type="text" id="userCity" name="userCity" autocomplete="address-level2" placeholder="Ex: Goiânia">
            </fieldset>


            <br>
            <button type="submit">Enviar</button>
        </form>
    </section>
    <main>

    </main>

    <footer>

    </footer>
</body>

</html>
