<!DOCTYPE html>0
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <title>form seo acessibilidade-CULTURAMA</title>
</head>

<body>
    <main>
        <header>
            <img src="assets/logo-culturama.png" alt="logo culturama">
            <h1>Pesquisa de Opinião</h1>
        </header>
        <section>
            <form action="sucesso.html" method="get">
                <!--tag fieldset: expoe ao navegador que está começando um conjunto de elementos, relação entre si semanticamente-->
                <fieldset>
                    <!--tag legend adiciona legenda-->
                    <legend>Dados Pessoais</legend>
                    <label for="name">Nome</label>
                    <input id="name" type="text" name="userName" required>
                    <br>

                    <label for="age">Idade</label>
                    <input id="age" type="number" name="age" min="12" max="100" required>
                    <br>
                    <label for="birthdate">Data de Nascimento</label>
                    <input id="birthdate" type="date" name="birthdate">
                    <br>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="userEmail" required>
                    <br>
                    <label for="phoneNumber">Telefone</label>
                    <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9{11}]"
                        placeholder="DDD + numero sem espaco e hifen" aria-describedby="phoneHelp">
                    <small id="phoneHelp">Preencha com 11 digítos no formato: DDD + numero sem espaços ou hífen.</small>

                    <br>

                    <label for="image">Upload de Foto</label>
                    <input id="image" type="file" accept="image/*" name="userImage" aria-describedby="imageHelp">
                    <small id="imageHelp">Envie uma foto no formato png ou jpeg</small>
                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>
                    <p>Gênero</p>
                    <input id="fem" type="radio" name="userGender" value="feminino">
                    <label for="fem">Feminino</label>

                    <input id="masc" type="radio" name="userGender" value="masculino">
                    <label for="masc">Masculino</label>

                    <input id="otherNotInformed" type="radio" name="userGender" value="outro/prefiroNaoInformar">
                    <label for="otherNotInformed">Outro/Prefiro Não Informar</label>
                    <br>
                    <label for="maritalStatus">Estado Civil</label>
                    <select id="maritalStatus" name="userMaritalStatus">
                        <option value="notSelected">Selecione...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="viuvo">Viuvo</option>
                        <option value="divorciado">Divorciado</option>
                    </select>

                    <br>
                    <label for="state">Estados</label>
                    <select id="state" name="userState" required>
                        <option value="acre">Acre</option>
                        <option value="alagoas">Alagoas</option>
                        <option value="amapa">Amapá</option>
                        <option value="amazonas">Amazonas</option>
                        <option value="bahia">Bahia</option>
                        <option value="ceara">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="espiritoSatno">Espirito Santo</option>
                        <option value="goias">Goiás</option>
                        <option value="maranhao">Maranhão</option>
                        <option value="MTdoSul">Mato Grosso do Sul</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="para">Pará</option>
                        <option value="paraiba">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="pernambuco">Pernambuco</option>
                        <option value="piaui">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                        <option value="rondonia">Rondônia</option>
                        <option value="roraima">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="sergipe">Sergipe</option>
                        <option value="tocantins">Tocantins</option>
                    </select>

                    <br>
                    <label for="city">Cidade</label>
                    <input type="text" id="city" name="userCity" autocomplete="address-level2"
                        placeholder="Ex: Goiânia">
                </fieldset>



                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes Sociais:</p>
                    <input id="instagram" type="checkbox" name="social" value="instagram">
                    <label for="instagram">Instagram</label>
                    <br>
                    <input id="facebook" type="checkbox" name="social" value="facebook">
                    <label for="facebook">Facebook</label>
                    <br>
                    <input id="tiktok" type="checkbox" name="social" value="tiktok">
                    <label for="tiktok">TikTok</label>
                    <br>
                    <input id="twitterX" type="checkbox" name="social" value="twitter">
                    <label for="twitterX">Twitter/X</label>
                    <br>
                    <input id="linkedin" type="checkbox" name="social" value="linkedin">
                    <label for="linkedin">LinkedIn</label>
                    <br>
                    <label for="musicStyle">Estilo Musical</label>
                    <input list="styleTypes" id="musicStyle" name="userMusicStyle" type="text">

                    <datalist id="styleTypes">
                        <option value="Rock">
                        <option value="Pop">
                        <option value="Indie">
                        <option value="Funk">
                        <option value="Sertanejo">
                        <option value="Outro">
                    </datalist>
                    <br>
                    <label for="favoriteColor">Cor Favorita</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">
                </fieldset>

                <fieldset>
                    <legend>Opnião</legend>

                    <label for="comment">Escreva sua opinião:</label>
                    <textarea id="comment" name="userComment" placeholder="Digite aqui sua opinião..."></textarea>


                    <br>
                    <input type="radio" name="userOpnion" id="otima">
                    <label for="otima">Otima</label>
                    <br>
                    <input type="radio" name="userOpnion" id="regular">
                    <label for="regular">Regular</label>
                    <br>
                    <input type="radio" name="userOpnion" id="ruim">
                    <label for="ruim">Ruim</label>
                </fieldset>


                <fieldset>
                    <legend>Confirmações</legend>

                    <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
                    <label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
                    <br>
                    <input type="checkbox" name="userGetResult" id="getResult" value="accepted">
                    <label for="getResult">Desejo receber o resultado por e-mail</label>
                </fieldset>
                <br>
                <button type="submit" aria-label="Enviar dados do formulário">Enviar</button>
                <button type="reset" aria-label="Limpar dados do formulário">Limpar</button>
            </form>
        </section>







    </main>

    <footer>

    </footer>
</body>

</html>
